<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0e12;
    --panel: rgba(16, 19, 25, 0.86);
    --edge: rgba(255, 255, 255, 0.09);
    --text: #eef1f5;
    --muted: #8b94a3;
    --chief: #1fc8a9;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --top: calc(16px + env(safe-area-inset-top, 0px));
    --bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    --left: calc(16px + env(safe-area-inset-left, 0px));
    --right: calc(16px + env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font: 13px/1.45 var(--mono); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #scene.dragging { cursor: grabbing; }
  #scene.hovering { cursor: pointer; }
  button { font: inherit; color: inherit; }
  button:focus-visible, .dept:focus-visible { outline: 2px solid var(--chief); outline-offset: 2px; }

  .panel { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  /* The one decorative device: the agents' own face, reused as UI chips */
  .chip { --c: var(--chief); position: relative; flex: none; display: inline-block; width: 1em; height: 1em; font-size: 22px; background: var(--c); border-radius: 50%; }
  .chip.square { border-radius: 24%; }
  .chip.hex { border-radius: 0; clip-path: polygon(50% 0, 94% 25%, 94% 75%, 50% 100%, 6% 75%, 6% 25%); }
  .chip::before, .chip::after { content: ""; position: absolute; top: 31%; width: 0.13em; height: 0.34em; border-radius: 0.1em; background: #fff; transform: rotate(18deg); }
  .chip::before { left: 35%; }
  .chip::after { left: 54%; }

  #brand { position: fixed; z-index: 2; top: var(--top); left: var(--left); display: flex; align-items: center; gap: 14px; pointer-events: none; }
  #brand .chip { font-size: 46px; box-shadow: 0 0 0 7px rgba(31, 200, 169, 0.14), 0 0 36px rgba(31, 200, 169, 0.5); }
  #brand h1 { margin: 0; font-size: 31px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5); }
  #brand p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
  #brand p b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  body.day #brand h1 { color: #11151b; text-shadow: none; }
  body.day #brand p { color: #4a5362; }
  body.day #brand p b { color: #11151b; }

  #depts { top: calc(var(--top) + 70px); left: var(--left); width: 296px; padding: 6px; }
  .dept { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 11px; padding: 8px 8px; border-radius: 11px; cursor: pointer; }
  .dept:hover { background: rgba(255, 255, 255, 0.05); }
  .dept-name { font-weight: 600; }
  .dept-stat { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .dept-stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dept-count { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .add { width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.04); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
  .add:hover { background: rgba(31, 200, 169, 0.18); border-color: rgba(31, 200, 169, 0.5); }

  #controls { top: var(--top); right: var(--right); display: flex; gap: 2px; padding: 5px; border-radius: 14px; }
  #controls button { font-size: 12px; font-weight: 600; background: transparent; border: 0; border-radius: 10px; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
  #controls button:hover { background: rgba(255, 255, 255, 0.07); }
  #controls button[aria-pressed="true"] { background: rgba(31, 200, 169, 0.16); color: var(--chief); }
  #btn-speed { min-width: 44px; font-variant-numeric: tabular-nums; }

  #feed { left: var(--left); bottom: var(--bottom); width: 350px; padding: 12px 14px 10px; }
  #feed h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--chief); box-shadow: 0 0 10px var(--chief); animation: live 1.6s ease-in-out infinite; }
  @keyframes live { 50% { opacity: 0.35; } }
  #feed ol { list-style: none; margin: 0; padding: 0; }
  #feed li { display: flex; gap: 9px; align-items: center; padding: 3px 4px; margin: 0 -4px; border-radius: 6px; font-size: 12px; color: #c3cad4; cursor: pointer; }
  #feed li:hover { background: rgba(255, 255, 255, 0.05); }
  #feed li .chip { font-size: 11px; }
  #feed li .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feed li b { color: var(--text); font-weight: 600; }
  #feed li.new { animation: feedIn 0.35s ease-out; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-4px); } }

  #card { right: var(--right); bottom: var(--bottom); width: 300px; padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-head .chip { font-size: 36px; }
  #card-name { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
  #card-role { color: var(--muted); font-size: 12px; }
  #card-close { margin-left: auto; align-self: flex-start; width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--edge); background: transparent; cursor: pointer; font-size: 16px; padding: 0; }
  #card-close:hover { background: rgba(255, 255, 255, 0.07); }
  #card-status { margin: 12px 0 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); font-size: 12.5px; min-height: 42px; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin: 0; }
  .card-grid dt { color: var(--muted); font-size: 11px; }
  .card-grid dd { margin: 2px 0 0; font-weight: 600; }
  #card-follow { border: 1px solid rgba(31, 200, 169, 0.5); background: rgba(31, 200, 169, 0.14); color: var(--chief); border-radius: 9px; padding: 7px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

  #hint { left: 50%; bottom: var(--bottom); transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; color: var(--muted); transition: opacity 0.6s; pointer-events: none; white-space: nowrap; }
  #hint.gone { opacity: 0; }
  #hint .touch { display: none; }

  #tag { position: fixed; z-index: 1; left: 0; top: 0; pointer-events: none; padding: 5px 9px; border-radius: 8px; background: rgba(12, 14, 18, 0.9); border: 1px solid var(--edge); font-size: 12px; font-weight: 600; white-space: nowrap; }
  #tag small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 11px; }

  #loader { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; background: var(--ink); transition: opacity 0.8s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .chip { font-size: 64px; animation: hop 0.6s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-16px); } }
  #loader p { color: var(--muted); margin: 22px 0 0; text-align: center; max-width: 34ch; }

  @media (max-width: 1180px) { #hint { display: none; } }
  @media (max-width: 760px) {
    #brand { gap: 10px; }
    #brand .chip { font-size: 32px; box-shadow: 0 0 0 5px rgba(31, 200, 169, 0.14), 0 0 22px rgba(31, 200, 169, 0.5); }
    #brand h1 { font-size: 22px; }
    #brand p { font-size: 11px; margin-top: 4px; }
    #depts { top: calc(var(--top) + 52px); right: var(--right); width: auto; display: flex; overflow-x: auto; padding: 5px; scrollbar-width: none; }
    #depts::-webkit-scrollbar { display: none; }
    #dept-list { display: flex; gap: 2px; }
    .dept { grid-template-columns: auto auto auto; gap: 7px; padding: 5px 6px; flex: none; }
    .dept-meta { display: none; }
    .add { width: 24px; height: 24px; }
    #controls { top: auto; bottom: var(--bottom); left: var(--left); right: var(--right); overflow-x: auto; justify-content: space-between; scrollbar-width: none; }
    #controls button { padding: 8px 7px; font-size: 11px; }
    #feed { display: none; }
    #card { left: var(--left); right: var(--right); width: auto; bottom: calc(var(--bottom) + 56px); }
    #hint { display: block; bottom: calc(var(--bottom) + 56px); left: var(--left); right: var(--right); transform: none; text-align: center; white-space: normal; border-radius: 14px; }
    #btn-snap, .wide { display: none; }
    #hint .desk { display: none; }
    #hint .touch { display: inline; }
  }
  @media (max-height: 640px) and (min-width: 761px) { #feed { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    #loader .chip, .live { animation: none; }
    #feed li.new { animation: none; }
  }
html.embed #brand,html.embed #depts,html.embed #feed,html.embed #hint,html.embed #controls{display:none!important}
html.embed #card{display:none!important}
html.embed,html.embed body{background:transparent}
</style>
</head>
<body>
<canvas id="scene" aria-label="Bot Town: a 3D city of little bots running errands"></canvas>

<header id="brand">
  <span class="chip" aria-hidden="true"></span>
  <div>
    <h1>Bot Town</h1>
    <p><b id="pop">0</b> bots working, <b id="done">0</b> jobs done</p>
  </div>
</header>

<nav id="depts" class="panel" aria-label="Departments">
  <div id="dept-list"></div>
</nav>

<div id="controls" class="panel" role="toolbar" aria-label="Town controls">
  <button id="btn-pause" type="button" aria-pressed="false" title="Pause (Space)">Pause</button>
  <button id="btn-speed" type="button" title="Change speed">1×</button>
  <button id="btn-theme" type="button" title="Day or night (N)">Day</button>
  <button id="btn-cam" type="button" aria-pressed="false" title="Follow a random bot (F)">Bot cam</button>
  <button id="btn-snap" type="button" title="Save the current view as an image">Save PNG</button>
  <button id="btn-reset" type="button" title="Reset view (R)">Reset<span class="wide"> view</span></button>
</div>

<section id="feed" class="panel" aria-label="Activity">
  <h2><span class="live" aria-hidden="true"></span>Activity</h2>
  <ol id="feed-list" aria-live="off"></ol>
</section>

<aside id="card" class="panel" hidden>
  <div class="card-head">
    <span id="card-chip" class="chip" aria-hidden="true"></span>
    <div><div id="card-name"></div><div id="card-role"></div></div>
    <button id="card-close" type="button" aria-label="Close">×</button>
  </div>
  <p id="card-status"></p>
  <dl class="card-grid">
    <div><dt id="card-jobs-label">Jobs done</dt><dd id="card-jobs">0</dd></div>
    <div><dt>Carrying</dt><dd id="card-carry">Nothing</dd></div>
    <button id="card-follow" type="button" hidden>Follow</button>
  </dl>
</aside>

<div id="hint" class="panel"><span class="desk">Drag to orbit, right-drag to pan, scroll to zoom, click a bot to follow it</span><span class="touch">Drag to orbit, pinch to zoom, tap a bot to follow it</span></div>
<div id="tag" hidden></div>
<div id="loader"><span class="chip" aria-hidden="true"></span><p id="loader-text">Building Bot Town…</p></div>

<script src="/vendor/three.min.js"></script>
<script>
(function () {
  'use strict';
  const loaderText = document.getElementById('loader-text');
  if (!window.THREE) { loaderText.textContent = 'Three.js did not load. Connect to the internet and reload this file.'; return; }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------------ helpers
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const srand = mulberry32(20260923); // seeded: the town layout is the same every load
  const rand = Math.random;
  const TAU = Math.PI * 2;
  const pick = (arr, r = rand) => arr[Math.floor(r() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const damp = (k, dt) => 1 - Math.exp(-k * dt);
  function angleLerp(a, b, t) { const d = ((((b - a + Math.PI) % TAU) + TAU) % TAU) - Math.PI; return a + d * t; }
  function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function shuffle(arr, r = rand) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function roundRectPath(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function money(v) { return v >= 1e6 ? (v / 1e6).toFixed(1) + 'm' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(v); }
  const V2 = THREE.Vector2, V3 = THREE.Vector3;
  const tmpV = new V3(), tmpV2 = new V3(), UP = new V3(0, 1, 0);

  // ------------------------------------------------------------------ town layout
  const N = 5, BLOCK = 18, ROAD = 7, PITCH = BLOCK + ROAD, HALF = (N * PITCH) / 2, CURB = 0.3;
  const roadCoord = (i) => -HALF + i * PITCH;
  const blockCenter = (i) => roadCoord(i) + PITCH / 2;

  const DEPTS = {
    chief:    { name: 'Chief',    color: 0x1fc8a9, css: '#1fc8a9', shape: 'circle' },
    inbox:    { name: 'Inbox',    color: 0xff3d9a, css: '#ff3d9a', shape: 'circle', block: [2, 0], place: 'Inbox Post Office', stat: ['letter delivered', 'letters delivered'], speed: 8.6, count: 5 },
    sales:    { name: 'Sales',    color: 0xff7a1a, css: '#ff7a1a', shape: 'hex',    block: [0, 1], place: 'Sales Market',      stat: ['deal closed', 'deals closed'],      speed: 7.6, count: 5 },
    accounts: { name: 'Accounts', color: 0x8b5cf6, css: '#8b5cf6', shape: 'circle', block: [4, 1], place: 'Accounts Bank',     stat: 'banked',            speed: 7.2, count: 4 },
    talent:   { name: 'Talent',   color: 0x2f7bff, css: '#2f7bff', shape: 'square', block: [1, 4], place: 'Talent Office',     stat: ['hire approved', 'hires approved'],    speed: 7.8, count: 4 },
    expense:  { name: 'Expense',  color: 0xef4444, css: '#ef4444', shape: 'circle', block: [3, 4], place: 'Expense Desk',      stat: ['receipt filed', 'receipts filed'],    speed: 8.0, count: 4 },
  };
  const CITIZEN = { name: 'Citizens', colors: [0xffd21f, 0x8ee05c, 0x27d3f0], css: ['#ffd21f', '#8ee05c', '#27d3f0'], stat: ['visit', 'visits'], speed: 5.4, count: 12, size: 1.0 };
  const ROLE_ORDER = ['inbox', 'sales', 'accounts', 'talent', 'expense', 'citizen'];
  const ORANGE = 0xff7a1a, GREEN = 0x2ec28e;
  const MAX_BOTS = 90;

  // ------------------------------------------------------------------ renderer
  const canvas = document.getElementById('scene');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
  catch (err) { loaderText.textContent = 'This browser could not start WebGL. Try Chrome, Edge, Firefox or Safari with hardware acceleration switched on.'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color();
  scene.fog = new THREE.Fog(0x000000, 170, 470);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1400);

  // ------------------------------------------------------------------ day / night theming
  const themed = [];
  let themeT = 0, themeGoal = 0; // 0 = night, 1 = day
  const T = {
    color(target, night, day) { const a = new THREE.Color(night), b = new THREE.Color(day); const f = (t) => target.copy(a).lerp(b, t); themed.push(f); f(themeT); return target; },
    num(obj, key, night, day) { const f = (t) => { obj[key] = night + (day - night) * t; }; themed.push(f); f(themeT); },
  };
  const applyTheme = () => { for (const f of themed) f(themeT); };
  T.color(scene.background, 0x0c0e12, 0xdde7ed);
  T.color(scene.fog.color, 0x0c0e12, 0xdde7ed);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
  T.color(hemi.color, 0x7188b4, 0xffffff); T.color(hemi.groundColor, 0x0b0d12, 0x8896a6); T.num(hemi, 'intensity', 0.8, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(70, 120, 45);
  T.color(sun.color, 0xa3b6ff, 0xfff1dc); T.num(sun, 'intensity', 0.55, 1.05);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 20, far: 330 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);

  // ------------------------------------------------------------------ textures
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  const dotTex = canvasTex(32, 32, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 16, 2.4, 0, TAU); g.fill(); }, true);
  dotTex.repeat.set(350, 350);
  const dashTex = canvasTex(64, 8, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.fillRect(0, 0, 36, h); }, true);
  dashTex.repeat.set(12, 1);
  function makeWindowTextures(seed) {
    const r = mulberry32(seed), S = 128, n = 4, cell = S / n;
    const map = canvasTex(S, S, (g) => {
      g.fillStyle = '#d9dee5'; g.fillRect(0, 0, S, S);
      for (let y = 0; y < n; y++) { g.fillStyle = '#c3cad3'; g.fillRect(0, y * cell, S, 2); for (let x = 0; x < n; x++) { g.fillStyle = '#3b4454'; g.fillRect(x * cell + 6, y * cell + 8, cell - 12, cell - 15); } }
    }, true);
    const em = canvasTex(S, S, (g) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (r() < 0.42) { const warm = r() < 0.72; g.fillStyle = warm ? (r() < 0.5 ? '#ffd083' : '#ffb85c') : '#9fdcff'; g.fillRect(x * cell + 6, y * cell + 8, cell - 12, cell - 15); }
    }, true);
    return [map, em];
  }

  // ------------------------------------------------------------------ materials
  function stdMat(night, day, opts = {}) { const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.9 }, opts)); T.color(m.color, night, day); return m; }
  function basicMat(night, day, opts = {}) { const m = new THREE.MeshBasicMaterial(opts); T.color(m.color, night, day); return m; }
  const M = {
    ground: stdMat(0x0e1116, 0xd4dde3, { roughness: 1 }),
    road: stdMat(0x14171d, 0x3e454f, { roughness: 0.95 }),
    sidewalk: stdMat(0x1d222b, 0xb8c1c9),
    lot: stdMat(0x12161c, 0xccd4da),
    park: stdMat(0x0f2a20, 0x8ccb93),
    plaza: stdMat(0x0e2622, 0xa9ddd0),
    water: stdMat(0x13364f, 0x74b9dc, { roughness: 0.2, metalness: 0.1 }),
    wall: stdMat(0x2d3442, 0xf2eee7),
    wall2: stdMat(0x333a48, 0xe5eaf0),
    roof: stdMat(0x1a1f27, 0xa4aeb8),
    dark: stdMat(0x0d1015, 0x4a525d),
    trunk: stdMat(0x3b2d22, 0x8a6446),
    canopy: stdMat(0x7a9a92, 0xffffff, { flatShading: true }),
    crate: stdMat(0x7a5634, 0xb27a44),
    mark: basicMat(0x363d48, 0xf1f4f6),
    bulb: basicMat(0xffe2a6, 0xd6dce1),
    lit: basicMat(0xffd27f, 0x6f7c8b),
    glass: basicMat(0x8fd3ff, 0x7c8b9a),
    blink: new THREE.MeshBasicMaterial({ color: 0xff4040 }),
    eye: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    paper: new THREE.MeshStandardMaterial({ color: 0xf5f7fb, emissive: 0xffffff, roughness: 0.7 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xffc83d, emissive: 0x7a5200, metalness: 0.4, roughness: 0.35 }),
  };
  T.num(M.paper, 'emissiveIntensity', 0.25, 0);
  const matCache = {};
  function accent(color) {
    const k = 'a' + color; if (matCache[k]) return matCache[k];
    const m = new THREE.MeshStandardMaterial({ color, emissive: color, roughness: 0.5 }); T.num(m, 'emissiveIntensity', 0.85, 0.18);
    return (matCache[k] = m);

  function botMat(color) {

        blockBase(bx, bz, M.lot); buildDept(sp, blockGroup(bx, bz, side)); makePlace(bx, bz, side, 'dept', DEPTS[sp].place, sp);
      } else {

  function buildMarkings() {
    const mats = [], o = new THREE.Object3D(), L = PITCH - ROAD, n = 6;
    for (let k = 0; k <= N; k++) for (let s = 0; s < N; s++) for (let m = 1; m < n - 1; m++) {
      const a = roadCoord(s) + ROAD / 2 + (L / n) * (m + 0.5);
      o.position.set(a, 0.02, roadCoord(k)); o.scale.set(1.5, 1, 0.2); o.updateMatrix(); mats.push(o.matrix.clone());
      o.position.set(roadCoord(k), 0.02, a); o.scale.set(0.2, 1, 1.5); o.updateMatrix(); mats.push(o.matrix.clone());
    }
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) { // zebra crossings
      const dirs = []; if (i < N) dirs.push([1, 0]); if (i > 0) dirs.push([-1, 0]); if (j < N) dirs.push([0, 1]); if (j > 0) dirs.push([0, -1]);

  // ------------------------------------------------------------------ carried items

  const ITEMS = {
    mail() { const g = new THREE.Group(); box(g, 0.95, 0.62, 0.1, M.paper, 0, 0, 0); box(g, 0.96, 0.12, 0.11, accent(DEPTS.inbox.color), 0, 0.12, 0, false); return g; },

  };

  // ------------------------------------------------------------------ bots
  const bots = [];
  const nameSeq = {};
  const CITIZEN_NAMES = shuffle(['Bloop', 'Pixel', 'Nib', 'Dot', 'Mochi', 'Byte', 'Tofu', 'Pip', 'Echo', 'Ziggy', 'Nova', 'Bean', 'Widget', 'Sprout', 'Fizz', 'Pebble', 'Momo', 'Zip', 'Doodle', 'Kiko', 'Lumo', 'Tink', 'Boba', 'Ruru']);

  function createBot(role, place, opts = {}) {
    const isCitizen = role === 'citizen', def = isCitizen ? CITIZEN : DEPTS[role];

    const color = isCitizen ? CITIZEN.colors[ci] : def.color, css = isCitizen ? CITIZEN.css[ci] : def.css;

  function showBubble(b, emoji, dur = 0) { b.bubbleMat.map = bubbleTexture(emoji); b.bubbleOn = true; b.bubbleTimer = dur; }
  function hideBubble(b) { b.bubbleOn = false; b.bubbleTimer = 0; }
  function setItem(b, kind) {

  // ---- routing on the road grid
  function buildPath(b, from, to) {
    const wps = [];
    const outJ = tmpV.subVectors(b.pos, from.step).dot(from.tangent);
    wps.push({ p: from.door.clone().addScaledVector(from.tangent, outJ), lane: true });
    if (from !== to && from.seg !== to.seg) {
      let best = null;
      for (const a of from.nodes) for (const c of to.nodes) {
        const d = Math.abs(a[0] - c[0]) + Math.abs(a[1] - c[1]) + rand() * 0.6;
        if (!best || d < best.d) best = { a, c, d };
      }
      const { a, c } = best;
      wps.push({ p: nodePos(a), lane: true });
      if (a[0] !== c[0] && a[1] !== c[1]) wps.push({ p: nodePos(rand() < 0.5 ? [c[0], a[1]] : [a[0], c[1]]), lane: true });
      if (a[0] !== c[0] || a[1] !== c[1]) wps.push({ p: nodePos(c), lane: true });
    }
    const inJ = (rand() - 0.5) * 3.4;
    wps.push({ p: to.door.clone().addScaledVector(to.tangent, inJ), lane: true });
    wps.push({ p: to.step.clone().addScaledVector(to.tangent, inJ), lane: false });

  }

    tmpV.subVectors(wp.p, b.pos); tmpV.y = 0;
    const dist = tmpV.length(), step = b.speed * dt;
    if (dist > 1e-4) b.dir.copy(tmpV).divideScalar(dist);
    b.laneGoal = wp.lane ? b.lane : 0;
    b.yawGoal = Math.atan2(b.dir.x, b.dir.z);

    } else b.pos.addScaledVector(b.dir, step);

  }

  // ---- jobs (the departments from the reference)

  const TASKS = {

        dropoff: to, dropoffEmoji: '✉️', travelText: `Delivering a letter to ${to.name}`, dropoffText: `Dropping a letter at ${to.name}`,
        done() { stats.inbox++; complete(b); log(b, `delivered a letter to ${to.name}`); } };

    sales(b) {

  function arrive(b) {

      b.state = 'atDropoff'; b.place = b.task.dropoff; b.timer = 1.2 + rand() * 1.2; b.yawGoal = b.place.faceYaw;

  function finishWork(b) {

  // ---- the Chief: dispatches jobs (orange), receives approvals (green dashed)
  const headWorld = new V3();

  function dispatch(b) {
    const task = TASKS[b.role](b);
    b.state = 'dispatching'; b.status = 'Getting orders from Chief';
    chief.head.getWorldPosition(headWorld);
    const to = botTop(b);
    chief.yawGoal = Math.atan2(to.x - headWorld.x, to.z - headWorld.z);
    b.yawGoal = Math.atan2(headWorld.x - b.group.position.x, headWorld.z - b.group.position.z);
    const from = headWorld.clone().add(tmpV2.subVectors(to, headWorld).setY(0).normalize().multiplyScalar(2.4));
    launchBeam(from, to, ORANGE, false, 0.8, () => {

    const from = botTop(b);
    chief.yawGoal = Math.atan2(from.x - headWorld.x, from.z - headWorld.z);

  function updateChief(dt, t) {
    chief.cooldown -= dt;

    else chief.idle += dt;

  // ---- beams + pulses
  const beams = [], pulses = [];
  function launchBeam(from, to, color, dashed, duration, onArrive) {
    const mid = from.clone().lerp(to, 0.5); mid.y = Math.max(from.y, to.y) + from.distanceTo(to) * 0.22;
    const curve = new THREE.QuadraticBezierCurve3(from.clone(), mid, to.clone());
    const segs = 56, radial = 6;
    const geo = new THREE.TubeGeometry(curve, segs, 0.13, radial, false);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, depthWrite: false, alphaMap: dashed ? dashTex : null });
    const headMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; geo.setDrawRange(0, 0);
    const orb = new THREE.Mesh(ORB_GEO, headMat), arrow = new THREE.Mesh(ARROW_GEO, headMat);
    const tan = curve.getTangent(1);
    arrow.quaternion.setFromUnitVectors(UP, tan); arrow.position.copy(to).addScaledVector(tan, -0.55); arrow.visible = false;
    scene.add(mesh, orb, arrow);
    beams.push({ mesh, geo, mat, headMat, orb, arrow, curve, segs, radial, t: 0, duration, onArrive, fired: false });
  }
  function updateBeams(dt) {
    for (let i = beams.length - 1; i >= 0; i--) {
      const bm = beams[i]; bm.t += dt;
      const g = Math.min(1, bm.t / bm.duration), e = easeInOut(g);
      bm.geo.setDrawRange(0, Math.floor(e * bm.segs) * bm.radial * 6);
      bm.curve.getPoint(e, bm.orb.position);
      if (g >= 1 && !bm.fired) { bm.fired = true; bm.orb.visible = false; bm.arrow.visible = true; if (bm.onArrive) bm.onArrive(); }
      if (g >= 1) {
        const f = (bm.t - bm.duration) / 0.6;
        bm.mat.opacity = 0.95 * (1 - f); bm.headMat.opacity = 1 - f;
        if (f >= 1) { scene.remove(bm.mesh, bm.orb, bm.arrow); bm.geo.dispose(); bm.mat.dispose(); bm.headMat.dispose(); beams.splice(i, 1); }

  }
  function pulse(pos, color) {
    const m = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.set(pos.x, pos.y + 0.08, pos.z); scene.add(m); pulses.push({ m, t: 0 });
  }
  function updatePulses(dt) {
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i]; p.t += dt; p.m.scale.setScalar(1 + p.t * 5); p.m.material.opacity = 0.9 * Math.max(0, 1 - p.t / 0.7);
      if (p.t >= 0.7) { scene.remove(p.m); p.m.material.dispose(); pulses.splice(i, 1); }
    }
  }

  // ---- per-frame bot update
  function updateBot(b, dt, t) {
    if (b.spawn < 1) b.spawn = Math.min(1, b.spawn + dt * 2.4);
    let moving = false;
    switch (b.state) {
      case 'toPickup': case 'toDropoff': case 'wander': moving = followPath(b, dt); break;
      case 'atPickup': case 'atDropoff': case 'visit': case 'approved':
        b.timer -= dt; if (b.timer <= 0) finishWork(b); break;
      case 'resting':
        b.timer -= dt; if (b.timer <= 0) { b.state = 'awaiting'; b.status = 'Waiting for orders from Chief'; chief.queue.push(b); } break;
    }
    // position: road centre line + keep-left lane offset, smoothed
    b.laneCur += (b.laneGoal - b.laneCur) * damp(5, dt);
    const tx = b.pos.x + b.dir.z * b.laneCur, tz = b.pos.z - b.dir.x * b.laneCur;
    const gp = b.group.position, k = damp(12, dt);
    gp.x += (tx - gp.x) * k; gp.z += (tz - gp.z) * k;
    gp.y += (groundY(gp.x, gp.z) - gp.y) * damp(14, dt);
    b.yaw = angleLerp(b.yaw, b.yawGoal, damp(9, dt)); b.group.rotation.y = b.yaw;

    // hop, squash, wiggle
    let hopY = 0, squash, wiggle = 0;
    if (moving) { b.hop += dt * b.speed * 1.3; const h = Math.abs(Math.sin(b.hop)); hopY = h * 0.45 * b.size; squash = (1 - h) * 0.1; }
    else {
      squash = Math.sin(t * 2.2 + b.seed) * 0.025;
      if (b.state === 'atPickup' || b.state === 'atDropoff' || b.state === 'visit') wiggle = Math.sin(t * 9 + b.seed) * 0.1;
    }
    const s = b.size * (b.spawn >= 1 ? 1 : Math.max(0.001, easeOutBack(b.spawn)));
    b.body.scale.set(s * (1 + squash * 0.6), s * (1 - squash), s * (1 + squash * 0.6));
    b.body.position.y = b.S.halfH * s * (1 - squash) + hopY;
    b.body.rotation.z = wiggle;
    if (b.item) { b.item.rotation.z = Math.sin(t * 7 + b.seed) * 0.1; if (b.itemKind === 'coin') b.item.rotation.y += dt * 3; }

    // blink
    b.blinkNext -= dt;
    if (b.blinkNext <= 0) { b.blinkT = 0.13; b.blinkNext = 2 + rand() * 4; }
    if (b.blinkT > 0) b.blinkT -= dt;
    const ey = b.blinkT > 0 ? 0.12 : 1; b.eyes[0].scale.y = ey; b.eyes[1].scale.y = ey;

    // speech bubble
    if (b.bubbleTimer > 0) { b.bubbleTimer -= dt; if (b.bubbleTimer <= 0) b.bubbleOn = false; }
    b.bubbleScale += ((b.bubbleOn ? 1 : 0) - b.bubbleScale) * damp(14, dt);
    b.bubble.visible = b.bubbleScale > 0.02;
    if (b.bubble.visible) { const bs = 1.75 * b.bubbleScale; b.bubble.scale.set(bs, bs, 1); b.bubble.position.y = b.S.halfH * 2 * s + 1.2 + hopY; }

    b.ring.visible = b === selected;
    if (b.ring.visible) b.ring.scale.setScalar(b.size * (1.15 + Math.sin(performance.now() / 250) * 0.08));
  }

  // ------------------------------------------------------------------ camera controls
  const HOME = { theta: 0.62, phi: 0.98, radius: 112, target: new V3(0, 0, 4) };
  const cam = { theta: HOME.theta, phi: HOME.phi, radius: HOME.radius, target: HOME.target.clone() };
  const goal = { theta: HOME.theta, phi: HOME.phi, radius: HOME.radius, target: HOME.target.clone() };
  if (!reduceMotion) { cam.radius = 270; cam.phi = 0.42; cam.theta = -0.5; }
  let introT = 0, lastInteract = performance.now(), selected = null, following = false, hovered = null;
  function updateCamera(dt) {
    introT += dt;
    if (following && selected) { goal.target.copy(selected.group.position); goal.target.y += 1.6; }
    else if (!reduceMotion && performance.now() - lastInteract > 9000) goal.theta += dt * 0.045;
    const k = damp(introT < 3 ? 1.4 : 4.5, dt);
    cam.theta += (goal.theta - cam.theta) * k; cam.phi += (goal.phi - cam.phi) * k; cam.radius += (goal.radius - cam.radius) * k;
    cam.target.lerp(goal.target, k);
    const sp = Math.sin(cam.phi);
    camera.position.set(cam.target.x + cam.radius * sp * Math.sin(cam.theta), cam.target.y + cam.radius * Math.cos(cam.phi), cam.target.z + cam.radius * sp * Math.cos(cam.theta));
    camera.lookAt(cam.target);
  }
  const hint = document.getElementById('hint');
  let hintGone = false;
  function interacted() {
    lastInteract = performance.now();
    if (!hintGone) { hintGone = true; setTimeout(() => hint.classList.add('gone'), 2500); }
  }
  function panBy(dx, dy) {
    if (following) setFollowing(false);
    const s = cam.radius * 0.0016;
    const rx = Math.cos(cam.theta), rz = -Math.sin(cam.theta), fx = -Math.sin(cam.theta), fz = -Math.cos(cam.theta);
    goal.target.x = clamp(goal.target.x - rx * dx * s + fx * dy * s, -95, 95);
    goal.target.z = clamp(goal.target.z - rz * dx * s + fz * dy * s, -95, 95);
  }
  const pointers = new Map();
  let drag = null, moved = 0, pinchPrev = 0, midPrev = null, lastHover = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { drag = e.button === 2 || e.button === 1 || e.shiftKey ? 'pan' : 'rotate'; moved = 0; }
    else if (pointers.size === 2) {
      drag = 'pinch'; moved = 99;
      const [p1, p2] = [...pointers.values()];
      pinchPrev = Math.hypot(p1.x - p2.x, p1.y - p2.y); midPrev = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }
    canvas.classList.add('dragging'); interacted();
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) {
      const now = performance.now();
      if (now - lastHover > 50) { lastHover = now; hovered = botAt(e.clientX, e.clientY); canvas.classList.toggle('hovering', !!hovered); }
      return;
    }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (drag === 'rotate') { goal.theta -= dx * 0.0055; goal.phi = clamp(goal.phi - dy * 0.0045, 0.22, 1.42); moved += Math.abs(dx) + Math.abs(dy); }
    else if (drag === 'pan') { panBy(dx, dy); moved += Math.abs(dx) + Math.abs(dy); }
    else if (drag === 'pinch' && pointers.size >= 2) {
      const [p1, p2] = [...pointers.values()];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y), mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      if (pinchPrev > 0 && d > 0) goal.radius = clamp(goal.radius * (pinchPrev / d), 14, 260);
      panBy(mid.x - midPrev.x, mid.y - midPrev.y);
      pinchPrev = d; midPrev = mid;
    }
    interacted();
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      if (drag !== 'pinch' && moved < 6) { const b = botAt(e.clientX, e.clientY); if (b) select(b, true); else if (selected) select(null); }
      drag = null; canvas.classList.remove('dragging');
    } else if (pointers.size === 1) drag = 'rotate';
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { if (!pointers.size) { hovered = null; canvas.classList.remove('hovering'); } });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0012), 14, 260); interacted(); }, { passive: false });

  // picking in screen space: forgiving for small, fast bots
  function botAt(x, y) {
    let best = null, bestD = Infinity;
    const f = Math.tan((camera.fov * Math.PI) / 360);
    for (const b of bots) {
      tmpV.copy(b.group.position); tmpV.y += b.S.halfH * b.size;
      const dist = camera.position.distanceTo(tmpV);
      tmpV.project(camera);
      if (tmpV.z > 1) continue;
      const sx = ((tmpV.x + 1) / 2) * window.innerWidth, sy = ((1 - tmpV.y) / 2) * window.innerHeight;
      const r = Math.max(22, ((b.S.halfH * b.size) / (dist * f)) * (window.innerHeight / 2) * 1.25);
      const d = Math.hypot(sx - x, sy - y);
      if (d < r && d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  // ------------------------------------------------------------------ HUD
  const $ = (id) => document.getElementById(id);
  const popEl = $('pop'), doneEl = $('done'), feedList = $('feed-list'), tag = $('tag');
  const card = $('card'), cardChip = $('card-chip'), cardName = $('card-name'), cardRole = $('card-role'), cardStatus = $('card-status');
  const cardJobs = $('card-jobs'), cardJobsLabel = $('card-jobs-label'), cardCarry = $('card-carry'), cardFollow = $('card-follow');
  const btnPause = $('btn-pause'), btnSpeed = $('btn-speed'), btnTheme = $('btn-theme'), btnCam = $('btn-cam');
  const rows = {};

  function buildHud() {
    const list = $('dept-list');
    for (const role of ROLE_ORDER) {
      const isC = role === 'citizen', d = isC ? CITIZEN : DEPTS[role];
      const row = document.createElement('div'); row.className = 'dept'; row.tabIndex = 0; row.setAttribute('role', 'button');
      row.setAttribute('aria-label', isC ? 'Follow a citizen' : `Show the ${d.place}`);
      const chip = document.createElement('span'); chip.className = 'chip ' + (isC ? 'square' : d.shape); chip.style.setProperty('--c', isC ? CITIZEN.css[0] : d.css);
      const meta = document.createElement('div'); meta.className = 'dept-meta';
      const nm = document.createElement('div'); nm.className = 'dept-name'; nm.textContent = d.name;
      const st = document.createElement('div'); st.className = 'dept-stat';
      meta.append(nm, st);
      const cnt = document.createElement('span'); cnt.className = 'dept-count';
      const add = document.createElement('button'); add.type = 'button'; add.className = 'add'; add.textContent = '+';
      add.title = isC ? 'Add a citizen' : `Add a ${d.name} bot`; add.setAttribute('aria-label', add.title);
      add.addEventListener('click', (e) => { e.stopPropagation(); spawn(role); });
      const go = () => focusRole(role);
      row.addEventListener('click', go);
      row.addEventListener('keydown', (e) => { if (e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(); } });
      row.append(chip, meta, cnt, add); list.append(row);
      rows[role] = { st, cnt };
    }
  }
  function updateHud() {
    popEl.textContent = bots.length; doneEl.textContent = stats.total.toLocaleString();
    const counts = {}; for (const b of bots) counts[b.role] = (counts[b.role] || 0) + 1;
    for (const role of ROLE_ORDER) {
      const r = rows[role], v = stats[role];
      r.st.innerHTML = role === 'accounts' ? `<b>$${money(v)}</b> banked` : `<b>${v.toLocaleString()}</b> ${(role === 'citizen' ? CITIZEN : DEPTS[role]).stat[v === 1 ? 0 : 1]}`;
      const n = counts[role] || 0; r.cnt.textContent = `${n} ${n === 1 ? 'bot' : 'bots'}`;
    }
    if (selected) renderCard();
  }
  function log(b, text) {
    const li = document.createElement('li'); li.className = 'new';
    const chip = document.createElement('span'); chip.className = 'chip ' + b.shapeKey; chip.style.setProperty('--c', b.css);
    const txt = document.createElement('span'); txt.className = 'txt';
    const nm = document.createElement('b'); nm.textContent = b.name;
    txt.append(nm, document.createTextNode(' ' + text));
    li.append(chip, txt); li.title = `Follow ${b.name}`;
    li.addEventListener('click', () => select(b, true));
    feedList.prepend(li);
    while (feedList.children.length > 7) feedList.lastChild.remove();
  }
  function renderCard() {
    const b = selected; if (!b) return;
    cardChip.className = 'chip ' + b.shapeKey; cardChip.style.setProperty('--c', b.css);
    cardName.textContent = b.name;
    cardRole.textContent = b.isCitizen ? 'Citizen' : `${DEPTS[b.role].name} department`;
    cardStatus.textContent = b.status;
    cardJobsLabel.textContent = b.isCitizen ? 'Places visited' : 'Jobs done';
    cardJobs.textContent = b.tasksDone;
    cardCarry.textContent = b.itemKind ? ITEM_LABEL[b.itemKind] : 'Nothing';
    cardFollow.hidden = following;
  }
  function setFollowing(on) { following = on && !!selected; btnCam.setAttribute('aria-pressed', String(following)); if (selected) renderCard(); }
  function select(b, follow) {
    selected = b;
    if (b) {
      card.hidden = false; setFollowing(follow);
      if (follow) { goal.radius = Math.min(goal.radius, 38); goal.phi = clamp(goal.phi, 0.75, 1.15); }
      renderCard();
    } else { card.hidden = true; setFollowing(false); }
    interacted();
  }
  function focusRole(role) {
    if (role === 'citizen') { const c = bots.filter((b) => b.isCitizen); if (c.length) select(pick(c), true); return; }
    const p = placeByKey[role];
    select(null); goal.target.set(p.center.x, 0, p.center.z); goal.radius = 62; goal.phi = clamp(goal.phi, 0.7, 1.1); interacted();
  }
  function spawn(role) {
    if (bots.length >= MAX_BOTS) { log({ name: 'Chief', shapeKey: 'circle', css: DEPTS.chief.css }, `says the town is full (${MAX_BOTS} bots)`); return; }
    const b = createBot(role, placeByKey.hq, { delay: 0.4 });
    if (role === 'citizen') b.timer = 0.8;
    pulse(b.group.position, b.color);
    log(b, role === 'citizen' ? 'moved into Bot Town' : 'joined the team');
    updateHud();
  }
  function updateTag() {
    const b = hovered || selected;
    if (!b) { tag.hidden = true; return; }
    tmpV.copy(b.group.position); tmpV.y += b.S.halfH * 2 * b.size + (b.bubble.visible ? 3.2 : 1.1);
    tmpV.project(camera);
    if (tmpV.z > 1 || tmpV.z < -1) { tag.hidden = true; return; }
    const x = ((tmpV.x + 1) / 2) * window.innerWidth, y = ((1 - tmpV.y) / 2) * window.innerHeight;
    tag.hidden = false;
    tag.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    if (tag.dataset.id !== String(b.id)) {
      tag.dataset.id = String(b.id); tag.textContent = b.name;
      const sm = document.createElement('small'); sm.textContent = b.isCitizen ? 'citizen' : DEPTS[b.role].name; tag.append(sm);
    }
  }

  // ---- controls
  let paused = false, speed = 1;
  const SPEEDS = [1, 2, 4, 0.5];
  function togglePause() { paused = !paused; btnPause.textContent = paused ? 'Play' : 'Pause'; btnPause.setAttribute('aria-pressed', String(paused)); }
  function toggleTheme() { themeGoal = themeGoal ? 0 : 1; btnTheme.textContent = themeGoal ? 'Night' : 'Day'; document.body.classList.toggle('day', themeGoal === 1); }
  function botCam() {
    const moving = bots.filter((b) => b !== selected && (b.state === 'toPickup' || b.state === 'toDropoff' || b.state === 'wander'));
    const pool = moving.length ? moving : bots.filter((b) => b !== selected);
    if (pool.length) select(pick(pool), true);
  }
  function resetView() { select(null); goal.theta = HOME.theta; goal.phi = HOME.phi; goal.radius = HOME.radius; goal.target.copy(HOME.target); }
  function snapshot() {
    renderer.render(scene, camera);
    const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'bot-town.png';
    document.body.append(a); a.click(); a.remove();
  }
  btnPause.addEventListener('click', togglePause);
  btnSpeed.addEventListener('click', () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; btnSpeed.textContent = speed + '×'; });
  btnTheme.addEventListener('click', toggleTheme);
  btnCam.addEventListener('click', botCam);
  $('btn-snap').addEventListener('click', snapshot);
  $('btn-reset').addEventListener('click', resetView);
  $('card-close').addEventListener('click', () => select(null));
  cardFollow.addEventListener('click', () => { setFollowing(true); goal.radius = Math.min(goal.radius, 38); });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button, [role="button"]') && (e.key === ' ' || e.key === 'Enter')) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'n') toggleTheme();
    else if (k === 'f') botCam();
    else if (k === 'r') resetView();
    else if (k === 'escape') select(null);
  });
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ------------------------------------------------------------------ main loop
  const clock = new THREE.Clock();
  let simT = 0, hudT = 0;
  function frame() {
    requestAnimationFrame(frame);
    const rdt = Math.min(clock.getDelta(), 0.05);
    const dt = paused ? 0 : rdt * speed;
    simT += dt;
    if (Math.abs(themeT - themeGoal) > 1e-3) { themeT += Math.sign(themeGoal - themeT) * Math.min(Math.abs(themeGoal - themeT), rdt * 1.4); applyTheme(); }
    updateChief(dt, simT);
    for (let i = 0; i < bots.length; i++) updateBot(bots[i], dt, simT);
    updateBeams(dt); updatePulses(dt);
    for (const ic of icons) { ic.obj.rotation.y += dt * 0.8; ic.obj.position.y = ic.base + Math.sin(simT * 1.6 + ic.phase) * 0.3; }
    for (const bl of blinkers) {
      bl.next -= dt; if (bl.next <= 0) { bl.t = 0.14; bl.next = 2 + rand() * 5; }
      if (bl.t > 0) bl.t -= dt;
      const sy = bl.t > 0 ? 0.12 : 1; for (const e of bl.eyes) e.scale.y = sy;
    }
    dashTex.offset.x -= dt * 1.6;
    M.blink.color.setHex(Math.sin(simT * 3.2) > 0.55 ? 0xff4040 : 0x3a1212);
    updateCamera(rdt);
    updateTag();
    hudT -= rdt; if (hudT <= 0) { hudT = 0.25; updateHud(); }
    renderer.render(scene, camera);
  }

  async function boot() {
    try { await Promise.race([document.fonts ? document.fonts.load('800 56px "JetBrains Mono"') : null, new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* fall back to system mono */ }
    buildShapes();
    buildTown();
    buildHud();
    for (const role of ['inbox', 'sales', 'accounts', 'talent', 'expense']) {
      for (let i = 0; i < DEPTS[role].count; i++) createBot(role, placeByKey[role], { instant: true, spread: 6, delay: 0.8 + rand() * 6 });
    }
    for (let i = 0; i < CITIZEN.count; i++) {
      const home = pickPlace((p) => p.kind === 'homes' || p.kind === 'park' || p.kind === 'shops');
      createBot('citizen', home, { instant: true, delay: rand() * 4 });
    }
    applyTheme(); updateHud();
    frame();
    requestAnimationFrame(() => document.getElementById('loader').classList.add('done'));
  }
  boot();
  if (new URLSearchParams(location.search).has('embed')) {
    document.documentElement.classList.add('embed');
    window.addEventListener('message', (e) => {
      const action = e.data && e.data.botTown;
      if (!action) return;
      const map = { reset: 'btn-reset', theme: 'btn-theme', cam: 'btn-cam', pause: 'btn-pause' };
      const el = document.getElementById(map[action]);
      if (el) el.click();
    });
  }
})();
</script>
</body>
</html>
